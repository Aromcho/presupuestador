# Presupuestador Gesetec · /etc/nginx/sites-available/gesetec-presupuestos  (lo instala deploy/install.sh, que reemplaza DOMINIO y UPLOADS)
# Solo atiende su propio subdominio: no toca los otros sitios del servidor.
# Después de crear el certificado, Certbot agrega el bloque 443 a ESTE archivo.

upstream gesetec_web { server 127.0.0.1:3130; keepalive 16; }
upstream gesetec_api { server 127.0.0.1:4130; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name DOMINIO;

    client_max_body_size 25m;   # listas de precios en Excel y fotos de equipos
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Fotos de equipos (WebP): directo del disco, caché larga
    location /uploads/ {
        alias UPLOADS/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location /api/ {
        proxy_pass http://gesetec_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://gesetec_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
